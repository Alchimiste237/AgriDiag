<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AgroDiag icon preview</title>
  <style>
    body { background:#222; color:#eee; font-family: sans-serif; padding:24px; }
    .row { display:flex; gap:32px; align-items:center; margin-bottom:24px; }
    .card { text-align:center; }
    .card p { margin:8px 0 0; font-size:12px; color:#aaa; }
    img { background:#111; border:1px solid #444; }
  </style>
</head>
<body>
  <h2>AgroDiag launcher icon</h2>
  <div class="row">
    <div class="card"><img src="../icon.png" width="256"><p>master 1024px (shown at 256)</p></div>
    <div class="card"><img src="../web/icons/Icon-192.png" width="192"><p>web 192</p></div>
    <div class="card"><img src="../web/icons/Icon-maskable-192.png" width="192"><p>maskable 192</p></div>
    <div class="card"><img src="../android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" width="192"><p>android xxxhdpi 192</p></div>
    <div class="card"><img src="../web/favicon.png" width="64"><p>favicon 32</p></div>
  </div>
</body>
</html>
