name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'app/adminDashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/adminDashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/adminDashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env from repository secrets
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CARTO_API_KEY=${{ secrets.VITE_CARTO_API_KEY }}
          EOF

      - name: Build
        # GitHub Pages serves the site at /<repo>/, so the Vite base must match.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA fallback: deep links such as /<repo>/analytics
      # would 404 on a hard refresh. Serving index.html as the 404 page makes
      # React Router take over and render the right view.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/adminDashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
